plugins {
    id "com.android.application"
}

android {
    namespace "fr.concoursdgfip.prep"
    compileSdk 35

    defaultConfig {
        applicationId "fr.concoursdgfip.prep"
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName "0.1.1"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            assets.srcDirs = ["src/main/assets", "../public_sources"]
        }
    }

}

dependencies {
    implementation "androidx.core:core:1.13.1"
}
